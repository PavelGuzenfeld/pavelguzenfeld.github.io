name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Probe docs sites
        run: |
          echo '{}' > data/docs.json
          for repo in $(yq '.[].repo' data/projects.yaml); do
            url="https://pavelguzenfeld.com/${repo}/"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url" || true)
            if [ "$code" = "200" ]; then
              jq --arg repo "$repo" --arg url "$url" '. + {($repo): $url}' data/docs.json > data/docs.tmp
              mv data/docs.tmp data/docs.json
            fi
          done

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: UTC
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Copy CNAME
        run: cp CNAME public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
